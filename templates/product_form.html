{% extends "base.html" %}
{% block title %}{{ 'Edit' if p else 'Add' }} product{% endblock %}
{% block content %}
<form class="auth wide" method="post">
  <h1>{{ 'Edit product' if p else 'List a product' }}</h1>
  <label>Product name <input name="name" value="{{ p.name if p }}" required></label>
  <div class="two">
    <label>Category <select name="category">
      {% for c in CATEGORIES %}<option {{ 'selected' if p and p.category == c }}>{{ c }}</option>{% endfor %}</select></label>
    <label>Unit <select name="unit">
      {% for u in UNITS %}<option {{ 'selected' if p and p.unit == u }}>{{ u }}</option>{% endfor %}</select></label>
  </div>
  <div class="two">
    <label>Price (₹ per unit) <input name="price" type="number" step="0.01" min="0.01" value="{{ p.price if p }}" required></label>
    <label>Quantity in stock <input name="quantity" type="number" min="0" value="{{ p.quantity if p }}" required></label>
  </div>
  <label>Description <textarea name="description" rows="3">{{ p.description if p and p.description }}</textarea></label>
  <label class="check"><input type="checkbox" name="available" {{ 'checked' if not p or p.available }}> Show this product to customers</label>
  <button class="btn">Save product</button>
  <a href="{{ url_for('dashboard') }}">Cancel</a>
</form>
{% endblock %}
